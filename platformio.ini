; PlatformIO project configuration
; ESP32 E-Paper Visual Timer
;
; Two environments:
;   esp32dev : hardware build — the "compile-green" gate (pio run -e esp32dev)
;   native   : host-side Unity unit tests for the pure domain (pio test -e native)
;
; See ARCHITECTURE.md for the full design.

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; Hardware target: ESP32-WROOM-32 dev board (CP2102 USB-UART)
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=3
; Version-pinned dependencies (see ARCHITECTURE.md §3 for rationale).
lib_deps =
    zinggjm/GxEPD2 @ ^1.6
    adafruit/Adafruit GFX Library @ ^1.11
    adafruit/Adafruit BusIO @ ^1.16
    adafruit/RTClib @ ^2.1
    madhephaestus/ESP32Encoder @ ^0.11
    mathertel/OneButton @ ^2.6
    h2zero/NimBLE-Arduino @ ^2.3
    bblanchon/ArduinoJson @ ^7.2

; ---------------------------------------------------------------------------
; Native test environment: pure domain only, no Arduino / no drivers.
; build_src_filter excludes src/app, src/drivers and src/main.cpp so the host
; compiler only sees Arduino-free code.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -I include
    -I test
; domain/ and app/ are pure C++ (Arduino-free); drivers/ and main.cpp are not.
build_src_filter =
    +<domain/>
    +<app/>
